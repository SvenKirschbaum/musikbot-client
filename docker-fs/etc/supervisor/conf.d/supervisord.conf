[supervisord]
nodaemon=true
user=root
childlogdir=/var/log

[program:create-spotify-audio-fifo]
priority=1
startsecs=0
autorestart=false
exitcodes=0
command=/usr/local/bin/create-spotify-audio-fifo

[program:spotifyd]
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
autorestart=true
command=/bin/sh -c '/usr/local/bin/create-spotify-audio-fifo && exec /usr/local/spotifyd/spotifyd --no-daemon --verbose'

[program:musikbot]
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
autorestart=true
command=/bin/sh -c '/usr/local/bin/create-spotify-audio-fifo && exec java --enable-native-access=ALL-UNNAMED -jar /usr/local/musikbot/musikbot.jar'
